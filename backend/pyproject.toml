[project]
name = "powertrade-backend"
version = "0.1.0"
description = "PowerTrade API + worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162",
  "uvicorn[standard]>=0.54",
  "pydantic-settings>=2.16",
  "sqlalchemy[asyncio]>=2.1",
  "asyncpg>=0.32",
  "psycopg[binary]>=3.3",
  "alembic>=1.20",
  "arq>=0.28",
  "redis>=5",
  "argon2-cffi>=25.1",
  "pyotp>=2.10",
  "itsdangerous>=2.2",
]

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1", "httpx>=0.28", "ruff>=0.17", "mypy>=2"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"migrations/*" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

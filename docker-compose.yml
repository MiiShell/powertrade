# Base stack. Use with docker-compose.test.yml (scripts/test-deploy.sh)
# or docker-compose.prod.yml (scripts/deploy.sh). Never run db/redis with published ports.
name: powertrade

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-backend: &backend
  <<: *hardening
  build: ./backend
  image: powertrade-backend:local
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  environment:
    PT_ENV: ${PT_ENV:-prod}
    PT_ALLOWED_ORIGINS: ${PT_ALLOWED_ORIGINS:?PT_ALLOWED_ORIGINS must be set}
    PT_ADMIN_USER: ${PT_ADMIN_USER:-admin}
    PT_PROVIDERS_MODE: ${PT_PROVIDERS_MODE:-live}
    PT_SEC_CONTACT: ${PT_SEC_CONTACT:-}
    PT_DB_APP_PASSWORD_FILE: /run/secrets/db_app_password
    PT_DB_OWNER_PASSWORD_FILE: /run/secrets/db_owner_password
    PT_REDIS_PASSWORD_FILE: /run/secrets/redis_password
    PT_SESSION_SECRET_FILE: /run/secrets/session_secret
    PT_ADMIN_PASSWORD_HASH_FILE: /run/secrets/admin_password_hash
    PT_ADMIN_TOTP_SECRET_FILE: /run/secrets/admin_totp_secret
    PT_FMP_API_KEY_FILE: /run/secrets/fmp_api_key
  secrets: [db_app_password, db_owner_password, redis_password, session_secret, admin_password_hash, admin_totp_secret, fmp_api_key]

services:
  db:
    <<: *hardening
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_DB: powertrade
      POSTGRES_USER: powertrade
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
      TIMESCALEDB_TELEMETRY: "off"
    secrets: [db_owner_password, db_app_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    shm_size: 256mb
    networks: [data]
    healthcheck:
      # TCP check: the temporary init server only listens on the socket
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U powertrade -d powertrade"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    <<: *hardening
    image: redis:8-alpine
    user: redis
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    command:
      - sh
      - -c
      - printf 'requirepass %s\n' "$$(cat /run/secrets/redis_password)" > /tmp/redis.conf && exec redis-server /tmp/redis.conf --appendonly yes --dir /data
    secrets: [redis_password]
    volumes: [redis_data:/data]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    profiles: [tools]
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    healthcheck: { disable: true }
    networks: [data]
    depends_on:
      db: { condition: service_healthy }

  backend:
    <<: *backend
    networks: [data, edge]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    <<: *backend
    command: ["arq", "app.worker.WorkerSettings"]
    # edge = outbound internet for data ingestion (Phase 1)
    networks: [data, edge]
    healthcheck:
      test: ["CMD", "arq", "--check", "app.worker.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    <<: *hardening
    build: ./frontend
    image: powertrade-frontend:local
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    networks: [edge]

  caddy:
    <<: *hardening
    image: caddy:2-alpine
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment:
      PT_SITE_ADDRESS: ${PT_SITE_ADDRESS:?PT_SITE_ADDRESS must be set}
      PT_TLS_MODE: ${PT_TLS_MODE:-internal}
    volumes:
      - ./infra/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_healthy }

networks:
  data:
    internal: true   # db/redis: no egress, unreachable from edge-only containers
  edge: {}

volumes:
  pgdata: {}
  redis_data: {}
  caddy_data: {}
  caddy_config: {}

secrets:
  db_owner_password: { file: "${PT_SECRETS_DIR:-./secrets}/db_owner_password" }
  db_app_password: { file: "${PT_SECRETS_DIR:-./secrets}/db_app_password" }
  redis_password: { file: "${PT_SECRETS_DIR:-./secrets}/redis_password" }
  session_secret: { file: "${PT_SECRETS_DIR:-./secrets}/session_secret" }
  admin_password_hash: { file: "${PT_SECRETS_DIR:-./secrets}/admin_password_hash" }
  admin_totp_secret: { file: "${PT_SECRETS_DIR:-./secrets}/admin_totp_secret" }
  fmp_api_key: { file: "${PT_SECRETS_DIR:-./secrets}/fmp_api_key" }
